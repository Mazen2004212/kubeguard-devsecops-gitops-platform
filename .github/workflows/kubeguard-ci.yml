name: KubeGuard CI Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  validate-build-scan:
    name: Validate, Build, and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Show Helm version
        run: helm version

      - name: Helm lint KubeGuard chart
        run: helm lint helm/kubeguard-app

      - name: Render Helm templates
        run: helm template kubeguard-app helm/kubeguard-app

      - name: Build KubeGuard Docker image
        run: docker build -t kubeguard-demo-app:ci ./app

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: 0

      - name: Trivy container image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: kubeguard-demo-app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: 0